<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MarbleRacing Manager</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><meta name="description" content="Run your own marble racing team: build marbles, pick your racers and chase the title.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..700&family=Onest:wght@400;500;600;700&family=Racing+Sans+One&display=swap">
<style>
/* Layout: quiet workshop desk. White header with team + coins, tab deck beside a race-day card; race view = 3D stage (or 2D board) + light timing list. Light theme only. */
:root{
  color-scheme:light;
  --bg:#F3F4F1; --surface:#FFFFFF; --sunk:#ECEEEA; --ink:#1B1E1C; --muted:#6A706B; --line:#E0E3DE; --line-2:#CDD1CB;
  --accent:#1F5BD6; --accent-soft:#E7EEFC; --on-accent:#FFFFFF;
  --lead:#D99A1E; --lead-soft:#FBF1DC;
  --good:#1E8449; --warn:#A35F00; --bad:#BF3328;
  --st-speed:#1F5BD6; --st-grip:#B07222; --st-stab:#16807A; --st-tough:#8A56C2; --st-weight:#7B827D;
  --r0:#7C847E; --r1:#24925A; --r2:#2E6BDB; --r3:#8441CC; --r4:#BF8200; --r5:#C2306E;
  --board:#E9EDE6; --board-line:#DCE2D8; --wood:#D8B582; --wood-edge:#A9824F; --sand:#EBD49F; --ice:#CFEAF5; --spiral:#B9824A; --funnel:#D3CCBD; --pegs:#9C7BC4; --split:#5E9E8A; --jump:#D9603B; --windmill:#4C86C6; --gate:#8C6A4F; --lift:#8E9AA8;
  --scrim:rgba(27,30,28,.36);
  --news:"Newsreader",Georgia,"Times New Roman",serif; --paper:#FBF8F1; --paper-line:#D9D2C2;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(27,30,28,.06),0 10px 30px rgba(27,30,28,.08);
  --r:10px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.eyebrow{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.eyebrow .ic{width:13px;height:13px}
.note{font-size:13px;color:var(--muted)}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ic.lg{width:18px;height:18px}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.tflag{display:inline-block;vertical-align:-2px;flex:none;border-radius:0;overflow:hidden}
.c .tflag,.code .tflag,.note .tflag{margin-right:4px}
.team-flag-btn{background:none;border:0;padding:0;cursor:pointer;display:grid;border-radius:0}
.icon-btn{background:none;border:0;padding:2px;cursor:pointer;color:var(--muted);border-radius:5px;vertical-align:middle;display:inline-grid}
.icon-btn:hover{color:var(--ink);background:var(--sunk)}.icon-btn .ic{width:14px;height:14px}
.tname{display:inline-flex;align-items:center;gap:7px}
.style-chip{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pflag{display:grid}
.flag-preview{display:flex;gap:14px;align-items:center;margin:6px 0 14px}
.flag-preview .tflag{box-shadow:var(--shadow)}
.pat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:440px){.pat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pat{display:grid;justify-items:center;gap:4px;padding:8px 4px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:12px}
.pat[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sw-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.swatch{width:26px;height:26px;border-radius:50%;border:1px solid var(--line-2);background:var(--sw);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.sw-row input[type=color]{width:30px;height:28px;border:1px solid var(--line-2);border-radius:6px;padding:0;background:var(--surface);cursor:pointer}
.rename{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rename input{flex:1;min-width:0;border:1px solid var(--line-2);border-radius:7px;padding:5px 8px;font-size:15px;font-weight:600}
.plate{font-family:var(--display);font-weight:700;font-size:15px;line-height:1;border:1.5px solid var(--ink);padding:6px 7px;border-radius:7px}
.team-name{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.team-sub{font-size:13px;color:var(--muted)}
.team-line{display:flex;align-items:center;gap:6px;min-width:0}
.team-line .team-name{min-width:0}
.cash-pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;background:var(--lead-soft);border:1px solid color-mix(in srgb,var(--lead) 35%,transparent);font-weight:700;font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.cash-pill.up{animation:flashUp 1s}.cash-pill.down{animation:flashDown 1s}
/* phones: one tight brand row (plate, flag, name, coins), then a slim row of fans, mood, language and an icon-only new-career button */
@media (max-width:600px){
  .topbar-in{gap:6px 10px;padding-block:8px}
  .brand{gap:8px;width:100%}
  .brand .plate{font-size:13px;padding:5px 6px}
  .team-name{font-size:16px;max-width:none}
  .team-sub{font-size:12px}
  .kpis{gap:14px;width:100%;justify-content:space-between}
  .kpi .eyebrow{font-size:10px}
  .kpi .kv{font-size:15px}
  .mood{width:44px}
  .menu-btn{padding:5px 7px}.menu-btn span{display:none}
}
.kpis{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.kpi{display:flex;flex-direction:column}
.kpi .eyebrow{font-size:11px}
.kpi .kv{font-weight:700;font-size:17px;line-height:1.2;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.kv.up{animation:flashUp 1s}.kv.down{animation:flashDown 1s}
@keyframes flashUp{0%,50%{color:var(--good)}}
@keyframes flashDown{0%,50%{color:var(--bad)}}
.coin{display:inline-block;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF1BF 0 18%,#E3AD2A 50%,#A87900 100%);flex:none}
.mood{width:64px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.mood i{display:block;height:100%;border-radius:3px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{background:none;border:0;padding:5px 9px;cursor:pointer;font-weight:600;font-size:12px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.menu-list{display:grid;gap:8px;margin:12px 0 4px}
.menu-item{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:11px 12px;cursor:pointer}
.menu-item:hover{border-color:var(--ink)}.menu-item .ic{width:18px;height:18px;flex:none}
.menu-item span{display:grid;gap:1px;min-width:0}.menu-item small{color:var(--muted);font-size:12.5px}
.menu-item.danger{color:var(--bad)}.menu-item.danger small{color:var(--muted)}
.save-code{width:100%;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line-2);border-radius:8px;padding:8px;background:var(--sunk);color:var(--ink);resize:vertical;word-break:break-all}
.menu-btn{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}

/* hub */
.hub{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;padding-block:20px 48px;align-items:start}
@media (max-width:920px){.hub{grid-template-columns:minmax(0,1fr)}.rail{order:-1}}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 12px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button .ic{width:15px;height:15px}
.badge-dot{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;display:inline-grid;place-items:center}
.badge-dot.zero{background:var(--sunk);color:var(--muted)}
.panel-head{margin-bottom:16px}
.panel-head h2{font-size:24px;display:flex;align-items:center;gap:10px}
.panel-head h2 .ic{display:none}
.panel-head p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:62ch}
h3.sec{font-size:13px;font-family:var(--body);font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:28px 0 10px}
.enter{animation:fadeUp .25s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px;transition:background .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn-primary:hover:not(:disabled){background:#333835}
.btn-go{width:100%;padding:13px;font-size:16px;background:var(--accent);border-color:var(--accent);color:var(--on-accent);border-radius:10px}
.btn-go:hover:not(:disabled){filter:brightness(1.08);border-color:var(--accent)}
.btn-sm{padding:5px 9px;font-size:13px;border-radius:7px}
.btn-danger{color:var(--bad)}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}

/* marble art */
.marble{--sz:44px;width:var(--sz);height:var(--sz);border-radius:50%;flex:none;display:inline-block;
  background:radial-gradient(circle at 32% 27%,rgba(255,255,255,.95) 0 6%,rgba(255,255,255,0) 15%),
  radial-gradient(circle at 45% 40%,rgba(255,255,255,0) 40%,rgba(0,0,0,.32) 100%),
  conic-gradient(from var(--rot,0deg),var(--c1) 0 20%,var(--c2) 27% 36%,var(--c1) 44% 68%,var(--c2) 76% 83%,var(--c1) 91%);
  box-shadow:0 1px 3px rgba(0,0,0,.2)}
.marble.t-stripes{background:radial-gradient(circle at 32% 27%,rgba(255,255,255,.95) 0 6%,rgba(255,255,255,0) 15%),radial-gradient(circle at 45% 40%,rgba(255,255,255,0) 40%,rgba(0,0,0,.3) 100%),repeating-linear-gradient(var(--rot,0deg),var(--c1) 0 17%,var(--c2) 17% 28%)}
.marble.t-galaxy{background:radial-gradient(circle at 32% 27%,rgba(255,255,255,.9) 0 5%,rgba(255,255,255,0) 13%),radial-gradient(circle at 64% 62%,var(--c2) 0 3%,transparent 4.5%),radial-gradient(circle at 38% 66%,#fff 0 2%,transparent 3%),radial-gradient(circle at 70% 36%,var(--c2) 0 2%,transparent 3%),radial-gradient(circle at 50% 46%,#fff 0 1.5%,transparent 2.5%),radial-gradient(circle at 28% 48%,var(--c2) 0 1.5%,transparent 2.5%),radial-gradient(circle at 40% 40%,color-mix(in srgb,var(--c1) 55%,#0B0D18) 0,#06070D 100%)}
.marble.t-cateye{background:radial-gradient(circle at 32% 27%,rgba(255,255,255,.95) 0 6%,rgba(255,255,255,0) 15%),linear-gradient(var(--rot,0deg),transparent 41%,var(--c2) 46% 54%,transparent 59%),linear-gradient(calc(var(--rot,0deg) + 60deg),transparent 44%,color-mix(in srgb,var(--c2) 70%,#fff) 48% 52%,transparent 56%),radial-gradient(circle,color-mix(in srgb,var(--c1) 18%,#fff) 50%,color-mix(in srgb,var(--c1) 60%,#fff) 100%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c1) 40%,transparent),0 1px 3px rgba(0,0,0,.15)}
.marble.t-clearie{background:radial-gradient(circle at 32% 27%,rgba(255,255,255,.95) 0 6%,rgba(255,255,255,0) 15%),radial-gradient(circle at 62% 62%,rgba(255,255,255,.95) 0 5%,transparent 6.5%),radial-gradient(circle at 40% 70%,rgba(255,255,255,.85) 0 3%,transparent 4.5%),radial-gradient(circle at 60% 36%,rgba(255,255,255,.85) 0 2.5%,transparent 3.5%),radial-gradient(circle,color-mix(in srgb,var(--c1) 28%,#fff) 45%,color-mix(in srgb,var(--c1) 72%,#fff) 100%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c1) 45%,transparent),0 1px 3px rgba(0,0,0,.15)}
.marble.t-batik{background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95) 0 5%,rgba(255,255,255,.25) 9%,rgba(255,255,255,0) 16%),radial-gradient(circle at 70% 78%,rgba(255,255,255,.35) 0 4%,rgba(255,255,255,0) 10%),radial-gradient(circle,rgba(255,255,255,0) 62%,rgba(255,255,255,.35) 80%,rgba(10,15,40,.45) 100%),var(--img,none) center/108% 108% no-repeat,#16204D;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 1px 3px rgba(0,0,0,.2)}
.marble.t-songket{background:radial-gradient(circle at 32% 27%,rgba(255,255,255,.8) 0 5%,rgba(255,255,255,0) 13%),radial-gradient(circle at 45% 40%,rgba(255,255,255,0) 45%,rgba(0,0,0,.35) 100%),repeating-linear-gradient(45deg,transparent 0 9px,#D9AE3F 9px 11px),repeating-linear-gradient(-45deg,transparent 0 9px,#D9AE3F 9px 11px),color-mix(in srgb,var(--c1) 70%,#000)}
.marble.t-paint{background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95) 0 5%,rgba(255,255,255,.3) 9%,rgba(255,255,255,0) 16%),radial-gradient(circle at 68% 78%,rgba(255,255,255,.3) 0 4%,rgba(255,255,255,0) 10%),radial-gradient(circle,rgba(255,255,255,0) 64%,rgba(255,255,255,.3) 82%,rgba(0,0,0,.28) 100%),var(--img,none) center/100% 100% no-repeat,color-mix(in srgb,var(--c1) 70%,#fff);box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),0 1px 3px rgba(0,0,0,.2)}
.mart{display:inline-grid;place-items:center;border-radius:50%;padding:3px;box-shadow:0 0 0 1.5px var(--line);flex:none}
.mart.r1{box-shadow:0 0 0 1.5px var(--r1)}.mart.r2{box-shadow:0 0 0 1.5px var(--r2)}.mart.r3{box-shadow:0 0 0 1.5px var(--r3)}.mart.r4{box-shadow:0 0 0 2px var(--r4)}.mart.r5{box-shadow:0 0 0 2px var(--r5),0 0 10px color-mix(in srgb,var(--r5) 45%,transparent)}
.rar{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:999px;border:1px solid currentColor;line-height:1.4}
.rar.r0{color:var(--r0)}.rar.r1{color:var(--r1)}.rar.r2{color:var(--r2)}.rar.r3{color:var(--r3)}.rar.r4{color:var(--r4)}.rar.r5{color:var(--r5)}

/* garage */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0;transition:border-color .2s}
.mcard.is-in{border-color:var(--accent)}
.mcard.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.015)}}
.mhead{display:flex;gap:12px;align-items:center}
.mhead>div{min-width:0;flex:1}
.mname{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.2}
.mmeta{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px}
.trait,.flag{display:inline-flex;align-items:center;gap:3px;color:var(--ink);font-weight:500}
.trait .ic,.flag .ic{width:12px;height:12px}
.tlines{display:grid;gap:3px;font-size:12px;line-height:1.35;padding:7px 9px;border-radius:7px;background:var(--sunk)}
.tlines strong{font-weight:600}
.trait-mini{font-size:11px;color:var(--muted);white-space:nowrap}
.flag{font-size:12px;padding:1px 6px;border-radius:999px;background:var(--accent-soft)}
.in-btn{font-size:12px;padding:5px 9px;border-radius:7px;white-space:nowrap}
.in-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stats{display:grid;gap:7px}
.srow{display:grid;grid-template-columns:100px 1fr 38px;gap:8px;align-items:center;font-size:13px;position:relative}
.srow .lbl{color:var(--muted);display:flex;align-items:center;gap:5px}
/* v114: Garage tabs, tool cards, workshop minigame */
.gtabs{display:flex;gap:6px;margin:4px 0 14px;flex-wrap:wrap}
.gtab{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);cursor:pointer}
.gtab .ic{width:16px;height:16px}.gtab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px}
.tc-h{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}.tc-n{font-weight:700}
.tcard .pips{display:flex;gap:4px}.tcard .pips i{flex:1;height:6px;border-radius:3px;background:var(--sunk)}.tcard .pips i.on{background:var(--accent)}
.tc-r{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}.tc-r strong{color:var(--ink);font-variant-numeric:tabular-nums}.tc-to{color:var(--good);font-weight:600}
.tc-up{width:100%;justify-content:center;margin-top:4px}.tc-max{text-align:center;margin-top:4px}
.mg-wrap{position:fixed;inset:0;z-index:200;background:rgba(10,12,14,.72);display:grid;place-items:center;padding:16px}
.mg{width:min(420px,100%);background:#1C1E22;color:#fff;border-radius:18px;padding:14px;display:grid;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.4);position:relative}
.mg-h{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}.mg-t{font:400 20px var(--race,inherit);display:flex;align-items:center;gap:8px}.mg-t .ic{width:18px;height:18px}
.mg-m{grid-column:1;font-size:12px;color:rgba(255,255,255,.65)}
.mg .mg-skip{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28)}.mg .mg-skip:hover{background:rgba(255,255,255,.2)}.mg .mg-skip:disabled{opacity:.4}.mg-m .lvl{color:#FFB37A}.mg-skip{grid-row:1/span 2;grid-column:2}
.mg-cv{width:100%;aspect-ratio:1;touch-action:none;border-radius:12px;background:radial-gradient(circle at 50% 40%,#2B3036,#16181B);user-select:none;-webkit-user-select:none}

.race{padding-block:16px 48px}

.rbox3 canvas{display:block;width:100%;height:100%}
.lap{position:absolute;left:10px;top:10px;display:flex;gap:4px;z-index:3}

.cams{position:absolute;right:10px;top:10px;display:flex;gap:4px;z-index:3;flex-wrap:wrap;justify-content:flex-end;max-width:62%}
.cams button{background:rgba(255,255,255,.92);border:1px solid transparent;border-radius:7px;padding:4px 9px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.cams button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.cams .ic{width:13px;height:13px}
.tag3d{position:absolute;left:0;top:0;z-index:2;pointer-events:none;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:600;padding:1px 8px;border-radius:9px;white-space:nowrap;transform:translate(-50%,-100%)}
.tag3d.rival{background:rgba(255,255,255,.88);color:#1B1E1C;font-size:10.5px;font-weight:500;padding:0 6px;display:inline-flex;align-items:center;gap:4px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tag3d.rival i{width:7px;height:7px;border-radius:50%;flex:none}
.ticker{position:absolute;left:10px;right:10px;bottom:10px;display:flex;max-width:560px;font-size:14px;z-index:3}
.ticker .tl{background:var(--bad);color:#fff;font-weight:600;font-size:12px;padding:6px 9px;text-transform:uppercase;letter-spacing:.05em;border-radius:7px 0 0 7px;display:flex;align-items:center}
.ticker .tx{background:rgba(255,255,255,.95);color:var(--ink);padding:6px 10px;border-radius:0 7px 7px 0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker .tx.new{animation:tickIn .3s ease-out}
@keyframes tickIn{from{opacity:0;transform:translateY(4px)}}
.status3{position:absolute;inset:0;display:grid;place-items:center;z-index:6;background:var(--board);text-align:center;padding:24px}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.walk{position:absolute;left:10px;right:10px;bottom:48px;z-index:4;background:rgba(255,255,255,.95);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);animation:fadeUp .25s ease-out}
.wk-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.wk-skip{background:none;border:1px solid var(--line-2);border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer;text-transform:none;letter-spacing:0;color:var(--ink)}
.wk-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:620px){.wk-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wk{display:flex;gap:7px;align-items:center;min-width:0;padding:4px 6px;border-radius:7px;background:var(--sunk)}
.wk.you{background:var(--accent-soft)}
.wk-p{font-weight:700;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.wk-n{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-t{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px}
#photo{position:absolute;inset:0;pointer-events:none;z-index:5}
.pf-flash{position:absolute;inset:0;background:#fff;animation:pfFlash .5s ease-out forwards}
@keyframes pfFlash{from{opacity:.9}to{opacity:0}}
.pf-line{position:absolute;top:8%;bottom:8%;left:50%;width:2px;background:var(--bad);box-shadow:0 0 0 1px rgba(255,255,255,.7)}
.pf-card{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--surface);border-radius:10px;padding:8px 16px;text-align:center;box-shadow:var(--shadow);animation:goPop .35s ease-out}
.pf-k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--bad)}
.pf-n{font-family:var(--display);font-weight:700;font-size:18px}
.lights{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.25);z-index:4;transition:opacity .4s}
.lights.out{opacity:0;pointer-events:none}
.lights .rig{display:flex;gap:10px;background:var(--surface);padding:12px 16px;border-radius:999px;box-shadow:var(--shadow)}
.lights .l{width:clamp(16px,3.4vw,26px);height:clamp(16px,3.4vw,26px);border-radius:50%;background:var(--sunk)}
.lights .l.on{background:var(--bad)}
.lights .go{font-family:var(--display);font-weight:800;font-size:clamp(36px,7vw,64px);color:var(--ink);background:var(--surface);padding:4px 26px;border-radius:999px;box-shadow:var(--shadow);animation:goPop .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes goPop{from{transform:scale(.6);opacity:0}}
#banner{position:absolute;inset:0;pointer-events:none;z-index:3;display:grid;place-items:center}
.banner{font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,48px);color:var(--ink);background:var(--surface);padding:6px 28px;border-radius:999px;box-shadow:var(--shadow);animation:goPop .4s ease-out;transition:opacity .6s}
.banner.gone{opacity:0}
.tower{list-style:none;margin:0;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);font-size:14px;position:relative;box-sizing:content-box;max-height:min(70vh,560px);overflow:auto}
.tower li{position:absolute;left:6px;right:6px;top:6px;height:30px;display:grid;grid-template-columns:22px 10px minmax(0,1fr) auto auto auto;gap:7px;align-items:center;padding:0 6px;border-radius:6px;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.tower .p{text-align:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:13px}
.tower li.lead .p{background:var(--lead);color:#fff;border-radius:4px}
.tower .sw{width:10px;height:10px;border-radius:50%;background:var(--c1)}
.tower .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.tower .c,.tower .g,.tower .d{color:var(--muted);font-size:12px}
.tower .c{white-space:nowrap;display:flex;align-items:center}
.tower .g,.tower .d{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tower .d{min-width:2.2em}.tower .g{min-width:3.4em}
/* v104: drop-down standings. Header row toggles; closed = top 3 + your marbles */
.tower li.th{display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;color:var(--ink);user-select:none;-webkit-user-select:none}
.tower li.th:hover{background:var(--sunk)}
.tower li.th .cnt{color:var(--muted);font-weight:500;margin-left:auto;font-size:11px}
.tower li.th .chev{display:inline-block;transition:transform .2s;color:var(--muted)}.tower.open li.th .chev{transform:rotate(180deg)}
.tower li.hid{opacity:0;visibility:hidden;pointer-events:none}
.tower li{transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .25s}
.tower .d.up,.myc .d.up{color:var(--good)}.tower .d.dn,.myc .d.dn{color:var(--bad)}
.tower li.you{background:var(--accent-soft)}
.tower li.you .n{color:var(--accent);font-weight:600}
.tower li.flash{animation:rowFlash .8s ease-out}
.tower li.out .n{text-decoration:line-through;color:var(--muted)}.tower li.out .g{color:var(--bad);font-weight:600}
/* 3D race: wider page, bigger stage. Compact standings rows. On wide screens (and in full screen) the standings sit over the stage's left edge (placeTower moves #tower into .boardwrap). */
.race.is3d{max-width:1640px}
.race.is3d .rbox3{aspect-ratio:16/9;max-height:calc(100vh - 170px);min-height:340px}
.race.is3d .race-grid{grid-template-columns:minmax(0,1fr)}
.race.is3d .tower{padding:4px;font-size:12px}
.race.is3d .tower li{left:4px;right:4px;top:4px;height:22px;grid-template-columns:18px 8px minmax(0,1fr) auto auto;gap:5px;padding:0 5px;border-radius:5px}
.race.is3d .tower .c{display:none}
.race.is3d .tower .p{font-size:11.5px}
.race.is3d .tower .sw{width:8px;height:8px}
.race.is3d .tower .g,.race.is3d .tower .d{font-size:11px}
.boardwrap>.tower{position:absolute;left:10px;top:46px;width:236px;z-index:3;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-color:rgba(0,0,0,.06);box-shadow:0 1px 3px rgba(0,0,0,.08);max-height:calc(100% - 110px)}
.race.is3d .boardwrap:has(>.tower) .ticker{left:256px}
.full-btn{padding:4px 7px!important}
/* phones: full-bleed stage, taller shape, smaller overlays */
@media (max-width:860px){
  .race.is3d{padding-block:8px 32px}

  .race.is3d .speed .btn{padding:5px 8px;font-size:12px}

  .race.is3d .rbox3{aspect-ratio:1/1;max-height:62vh;min-height:280px}

  .race.is3d .cams .full-btn{order:-1}
  .race.is3d .cams button{padding:4px 8px;font-size:11.5px;white-space:nowrap;flex:none;min-height:30px}

  .race.is3d .walk{bottom:40px;left:8px;right:8px;padding:6px 8px}
  .race.is3d .tower{margin-top:10px}
  .race.is3d .mine{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:601px) and (max-width:860px){ .race.is3d .rbox3{aspect-ratio:4/3} }
@media (max-height:520px) and (orientation:landscape){ .race.is3d .rbox3{aspect-ratio:auto;height:calc(100vh - 70px);max-height:none;min-height:0} }
/* full screen: the stage fills the screen (works on phones without the Fullscreen API) */
body.race-full{overflow:hidden}
body.race-full .boardwrap{position:fixed;inset:0;z-index:60;margin:0;border:0;border-radius:0}

@media (max-width:860px){ body.race-full .cams{left:max(8px,env(safe-area-inset-left,0px))} body.race-full .lap{top:calc(max(8px,env(safe-area-inset-top,0px)) + 38px)} body.race-full .boardwrap>.tower{top:calc(max(8px,env(safe-area-inset-top,0px)) + 76px)} }
@media (max-width:600px){ body.race-full .boardwrap>.tower{width:168px;max-height:42%} body.race-full .boardwrap>.tower .d{display:none} body.race-full .boardwrap>.tower li{grid-template-columns:16px 8px minmax(0,1fr) auto} body.race-full .race.is3d .boardwrap:has(>.tower) .ticker,body.race-full .boardwrap:has(>.tower) .ticker{left:8px} }
.flag.warn{background:#FBEBD8;color:var(--warn)}
.zchip.bad{background:#F8E3E0;color:var(--bad)}.zchip.warn{background:#FBEBD8;color:var(--warn)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:20;background:var(--scrim);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.overlay:not([hidden]){animation:fadeIn .2s ease-out}
@keyframes fadeIn{from{opacity:0}}
.sheet{background:var(--surface);color:var(--ink);border-radius:14px;width:min(560px,100%);padding:22px;box-shadow:var(--shadow);max-height:calc(100dvh - 32px);overflow:auto;animation:sheetIn .28s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetIn{from{opacity:0;transform:translateY(10px)}}
.sheet h2{font-size:24px;margin:4px 0 8px}
.sheet p{margin:0 0 10px;max-width:62ch}
.sheet .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.intro-art{display:flex;gap:6px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.field input{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:16px}
.res-table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 12px}
.res-table td{padding:5px 6px;border-bottom:1px solid var(--line)}
.res-table tr.you td{background:var(--accent-soft);font-weight:600}
.res-table td:first-child{width:38px;font-weight:600}
.fullres summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);padding:6px 0}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0}
.sum{background:var(--sunk);border-radius:8px;padding:10px}
.sum .k{font-size:12px;color:var(--muted)}
.sum .v{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.trophy3{display:grid;justify-items:center;gap:2px;margin:4px 0 -6px}
.t3slot{position:relative;width:180px;height:170px;display:grid;place-items:center}
.t3slot canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.t3slot.on .ticon{display:none}
.ticon .ic{width:72px;height:72px}
.t-gold .ticon{color:var(--lead)} .t-silver .ticon{color:#8F99A3} .t-bronze .ticon{color:#B5703A}
.tcap{display:grid;justify-items:center;line-height:1.25}
.tcap strong{font-family:var(--race,inherit);font-weight:400;font-size:18px;letter-spacing:.01em}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:8px;margin:18px 0 14px;text-align:center}
.podium .step{position:relative;border-radius:8px 8px 0 0;background:var(--sunk);padding:12px 6px 8px;display:grid;justify-items:center;align-content:start;gap:3px;animation:rise .5s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom}
.podium .p1{min-height:150px;background:var(--lead-soft);animation-delay:.25s}
.podium .p2{min-height:122px;animation-delay:.1s}
.podium .p3{min-height:104px;animation-delay:.4s}
.podium .step.you{box-shadow:inset 0 0 0 2px var(--accent)}
.podium .nm{font-weight:600;font-size:13px;line-height:1.2;word-break:break-word}
.podium .pl{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.podium .crown{color:var(--lead);position:absolute;top:-13px;background:var(--surface);border-radius:50%;padding:4px;display:grid;box-shadow:var(--shadow)}
@keyframes rise{from{transform:scaleY(.2);opacity:0}}
.press .q{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.3;margin:10px 0 14px}
.press .mic,.mic{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap}
.qprog{display:inline-flex;gap:4px;margin-left:auto}
.qprog i{width:20px;height:3px;border-radius:2px;background:var(--line)}
.qprog i.on{background:var(--ink)}
.answers{display:grid;gap:8px}
.react{margin:10px 0 0;padding:8px 10px;border-radius:8px;background:var(--sunk);font-size:14px;color:var(--ink)}
.who-asks{margin-top:12px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.who-asks.clash{color:var(--bad)}
.answer{text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:10px 12px;cursor:pointer;display:grid;gap:2px;transition:border-color .15s}
.answer .tone{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.answer .tone .ic{width:13px;height:13px}
.answer.tone0 .tone{color:var(--good)}.answer.tone1 .tone{color:var(--accent)}.answer.tone2 .tone{color:var(--bad)}
.answer.tone0:hover{border-color:var(--good)}.answer.tone1:hover{border-color:var(--accent)}.answer.tone2:hover{border-color:var(--bad)}
.gift{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px dashed var(--line-2);border-radius:var(--r);margin:6px 0;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast:not([hidden]){animation:toastIn .25s ease-out}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ===== v70: MarbleRacing Manager look (user's mockup): dark nav with the tabs, orange accent, team header card, Race Day dashboard ===== */
:root{--bg:#F1F2F4;--surface:#FFFFFF;--sunk:#EFF1F3;--ink:#1D1F23;--muted:#6B7078;--line:#E3E5E9;--line-2:#D2D5DA;
  --accent:#F26A1B;--accent-2:#DB5A0F;--accent-soft:#FEF0E6;--on-accent:#FFFFFF;--nav:#1C1E22;--r:14px;
  --shadow:0 1px 2px rgba(20,22,26,.05),0 8px 24px rgba(20,22,26,.06)}
body::before{background:var(--nav)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--accent-2);border-color:var(--accent-2)}
.btn{border-radius:10px}
.card{border-radius:16px;box-shadow:var(--shadow)}
/* nav */
.topbar .wrap,.hub.wrap{max-width:1360px}
.topbar{background:var(--nav);border-bottom:0;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.nav-in{display:flex;align-items:center;gap:8px 20px;min-height:64px}
.logo{display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;flex:none}
.logo-mark{width:40px;height:28px}
.logo b{display:block;font-family:var(--display);font-weight:800;font-size:19px;line-height:.95;letter-spacing:-.02em}
.logo i{display:block;font-family:var(--display);font-style:italic;font-weight:800;font-size:16px;line-height:1;color:var(--accent);letter-spacing:-.01em}
.nav-sep{width:1px;height:32px;background:rgba(255,255,255,.16);flex:none}
.topbar .tabs{display:flex;gap:4px;border:0;margin:0;padding:0;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;background:none;position:static;box-shadow:none}
.topbar .tabs button{color:rgba(255,255,255,.84);border:0;margin:0;border-radius:10px;padding:9px 14px;font-size:15px;font-weight:600;gap:8px;position:relative}
.topbar .tabs button:hover{color:#fff;background:rgba(255,255,255,.08)}
.topbar .tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
.topbar .tabs .ic{width:18px;height:18px}
.topbar .tabs .badge-dot{background:var(--accent);color:#fff;min-width:17px;height:17px;font-size:10.5px}
.topbar .tabs button[aria-selected="true"] .badge-dot{background:#fff;color:var(--accent)}
.nav-r{display:flex;gap:8px;align-items:center;flex:none}
.nav-r .lang{border-color:rgba(255,255,255,.22)}
.nav-r .lang button{color:rgba(255,255,255,.7)}
.nav-r .lang button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.nav-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:0;background:none;color:#fff;cursor:pointer}
.nav-btn:hover{background:rgba(255,255,255,.1)}.nav-btn .ic{width:20px;height:20px}
@media (max-width:860px){
  .nav-in{flex-wrap:wrap;padding-block:8px 6px;min-height:0}
  .nav-sep{display:none}
  .nav-r{margin-left:auto}
  .topbar .tabs{order:3;flex-basis:100%;padding-bottom:2px}
  .topbar .tabs button{padding:8px 12px;font-size:14px}
}
/* team header */
.hub{padding-top:0}
.teamhead{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 18px 18px;padding:14px 22px;margin-bottom:18px;display:flex;align-items:center;gap:12px 0;flex-wrap:wrap;box-shadow:var(--shadow)}
.th-id{display:flex;align-items:center;gap:14px;min-width:0;flex:1 1 320px}
.teamhead .plate{font-size:18px;padding:7px 9px;border-radius:9px}
.teamhead .team-name{font-size:26px;max-width:none}
.teamhead .team-sub{font-size:15px}
.th-stats{display:flex;align-items:center;flex-wrap:wrap;gap:10px 0}
.th-stat{display:flex;align-items:center;gap:10px;padding:2px 24px;border-left:1px solid var(--line);min-height:44px}
.th-stat:first-child{border-left:0}
.th-stat .ic{width:22px;height:22px;color:var(--muted)}
.th-k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.th-k .ic{width:15px;height:15px}
.th-v{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.teamhead .cash-pill{font-size:20px;padding:6px 16px;background:var(--surface);border:1px solid var(--line-2);gap:8px}
.teamhead .cash-pill .coin{width:20px;height:20px}
.th-mood{display:grid;gap:4px}
.th-mood .row{display:flex;align-items:center;gap:12px}
.teamhead .mood{width:140px;height:8px;border-radius:4px}
@media (max-width:760px){
  .teamhead{padding:12px 14px;border-radius:0 0 14px 14px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));border-left:0;border-right:0}
  .teamhead .team-name{font-size:20px}.teamhead .team-sub{font-size:13px}
  .th-id{gap:10px}.teamhead .plate{font-size:14px;padding:5px 7px}
  .th-stats{width:100%;justify-content:space-between}
  .th-stat{padding:0 12px;min-height:0}.th-stat:first-child{padding-left:0}
  .th-v{font-size:18px}.teamhead .cash-pill{font-size:16px;padding:4px 12px}.teamhead .cash-pill .coin{width:16px;height:16px}
  .teamhead .mood{width:70px}.th-stat>.ic{display:none}
  .teamhead .team-flag-btn svg{width:42px;height:28px}
}
/* Race Day dashboard */
.dash{display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"nx nx st" "ga ga st" "nw nw sp" "cal cal fz";align-items:stretch}
.dash .spon-offers{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.sheet:has(.spon-gate){width:min(900px,100%)}
.sheet:has(.pull-sheet){width:min(520px,100%)}
.pull-sheet .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.pull-sheet .swap{max-height:min(40vh,320px);overflow:auto}
/* v96: cascading rolls */
.cascade{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:8px 0 12px;cursor:pointer}
.cascade .ct{padding:4px 10px;border-radius:99px;border:1.5px solid var(--line);font-size:12px;font-weight:700;color:var(--muted);opacity:.4;transition:all .22s}
.cascade .ct small{font-weight:600;opacity:.85}
.cascade .ct.on{opacity:1;color:#fff;background:var(--c);border-color:var(--c);animation:casPop .32s ease-out}
.cascade .ar{font-size:11px;font-weight:700;color:var(--muted);opacity:.35;font-variant-numeric:tabular-nums;transition:opacity .2s}
.cascade .ar.on{opacity:1;color:var(--ink)} .cascade .st:not(.on){display:none} /* v97: hidden until reached */
@keyframes casPop{0%{transform:scale(.8)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.pull-sheet.cas .later{opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .35s,transform .35s}
.pull-sheet.cas.done .later{opacity:1;transform:none;pointer-events:auto}
.climb{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--muted);line-height:1.5}
.climb .rar{font-weight:700}
.swap-o{justify-content:flex-start;text-align:left;gap:10px}

.spon-gate .spon-offers{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}

.dash .cal{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.dash .friend{align-self:start}
@media (max-width:1100px){.dash{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"nx nx" "ga st" "nw nw" "sp sp" "cal cal" "fz fz"}}
@media (max-width:700px){.dash{grid-template-columns:minmax(0,1fr);grid-template-areas:"nx" "ga" "st" "nw" "sp" "cal" "fz"}}
.dc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:12px}
.dc-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dc-t{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.2;display:flex;align-items:center;gap:10px;margin:0}
.dc-t .ic{width:22px;height:22px;color:var(--accent)}
.dc-t .dim{font-weight:500;color:var(--ink)}
.dc-s{margin:-6px 0 0;font-size:14px;color:var(--muted)}
.chip-o{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);white-space:nowrap}
.dc-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn-link{border-radius:10px;padding:9px 14px;font-weight:600}
.btn-link .ic{width:18px;height:18px}
/* standings */
.ds-list{display:grid}
.ds-row{display:grid;grid-template-columns:24px 30px minmax(0,1fr) 34px;gap:10px;align-items:center;padding:9px 10px;border-top:1px solid var(--line);border-radius:10px}
.ds-row:first-child{border-top:0}
.ds-row .p{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);text-align:center}
.ds-row.first .p{color:var(--accent)}
.ds-row .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds-row .b{display:block;height:4px;border-radius:2px;background:var(--sunk);margin-top:6px;overflow:hidden;max-width:240px}
.ds-row .b i{display:block;height:100%;background:var(--accent);border-radius:2px}
.ds-row .pts{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;font-size:17px}
.ds-row.you{background:var(--accent-soft);border-top-color:transparent}
.ds-row.you .p{color:var(--accent)}
.ds-row.you+.ds-row{border-top-color:transparent}
/* garage */
.dg-list{display:grid;gap:4px}
.dg-row{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.05fr);gap:8px 14px;align-items:center;padding:12px;border:1px solid transparent;border-radius:12px;border-bottom-color:var(--line)}
.dg-row:last-child{border-bottom-color:transparent}
.dg-row.in{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.dg-name{display:flex;align-items:center;gap:4px;font-family:var(--display);font-weight:700;font-size:17px;min-width:0}
.dg-name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dg-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px}
.dg-meta .chip-o{font-size:12px;padding:1px 8px;color:var(--muted)}
.dg-trait{font-size:12.5px;display:inline-flex;gap:3px;align-items:center}.dg-trait .ic{width:12px;height:12px}
.dg-in{margin-top:6px;font-size:12px;padding:3px 9px;border-radius:999px}
.dg-in[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.dg-stats{display:grid;gap:5px}
.dg-s{display:grid;grid-template-columns:30px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:12px}
.dg-s .k{font-weight:600;color:var(--muted)}
.dg-s .v{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.dg-s .bar{height:6px}.dg-s .bar i{background:var(--accent)}
@media (max-width:420px){.dg-row{grid-template-columns:auto minmax(0,1fr)}.dg-stats{grid-column:1/-1}}
/* next race */
.nr-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center}
.nr-t{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.15;margin:0 0 8px}
.nr-line{display:flex;align-items:center;gap:8px;font-size:14px;margin:5px 0}
.nr-line .ic{color:var(--muted)}
.dash .mini{aspect-ratio:4/3;border-radius:12px}
.dc .entries{margin:0}
@media (max-width:420px){.nr-top{grid-template-columns:minmax(0,1fr)}.dash .mini{aspect-ratio:16/9}}
/* bet */
.bt-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px}
@media (max-width:420px){.bt-grid{grid-template-columns:minmax(0,1fr)}}
.bt-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;margin-bottom:6px}
.bt-row strong{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-row .code{font-size:12px;color:var(--muted)}
.bt-row .od{font-weight:700;font-variant-numeric:tabular-nums;border:1px solid var(--line-2);border-radius:9px;padding:3px 10px}
.bt-row[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.bt-row[aria-pressed="true"] .od{border-color:var(--accent);color:var(--accent)}
.bt-slip{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.bt-slip input{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;font-weight:600;font-variant-numeric:tabular-nums}
/* news */
.dn-item{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;padding:8px;border:0;background:none;border-radius:12px;cursor:pointer}
.dn-item:hover{background:var(--sunk)}
.dn-thumb{width:96px;height:68px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#2A2D33,#4A4F57);overflow:hidden;position:relative}
.dn-thumb::after{content:"";position:absolute;inset:auto 0 0;height:40%;background:repeating-linear-gradient(90deg,var(--accent) 0 10px,#fff 10px 20px);opacity:.85;transform:skewY(-8deg) translateY(30%)}
.dn-thumb>*{position:relative;z-index:1}
.dn-h{font-weight:700;font-size:15px;line-height:1.3}
.dn-src{font-size:12.5px;color:var(--muted);margin:2px 0}
.dn-b{font-size:13.5px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dn-item>.ic{color:var(--muted)}
/* gacha */
.gc-body{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:12px;align-items:center;flex:1}
.gc-art{width:96px;height:124px;position:relative;overflow:hidden}
.gc-art .gm{transform:scale(.54);transform-origin:top left;position:absolute;left:2px;top:0}
/* go */
.go-card{grid-area:go;position:relative;border:0;border-radius:16px;padding:24px 26px;cursor:pointer;text-align:left;color:#fff;overflow:hidden;min-height:150px;display:flex;align-items:center;gap:18px;
  background:linear-gradient(120deg,#F47B2C 0%,var(--accent) 45%,#E25609 100%);box-shadow:0 10px 24px rgba(242,106,27,.28)}
.go-card::before{content:"";position:absolute;right:-30px;top:-20px;width:260px;height:200%;opacity:.13;transform:rotate(14deg);
  background:conic-gradient(#fff 25%,transparent 0 50%,#fff 0 75%,transparent 0) 0 0/36px 36px}
.go-card>*{position:relative}
.go-card .ic{width:52px;height:52px;stroke-width:1.6}
.go-card .gt{font-family:var(--display);font-weight:800;font-size:36px;line-height:1;letter-spacing:-.02em}
.go-card .gs{font-size:17px;opacity:.95;margin-top:6px}
.go-card .arrow{margin-left:auto;width:52px;height:52px;border-radius:50%;background:#fff;color:var(--accent);display:grid;place-items:center;flex:none}
.go-card .arrow .ic{width:26px;height:26px;stroke-width:2.4}
.go-card:hover:not(:disabled){filter:brightness(1.05)}
.go-card:disabled{cursor:not-allowed;background:linear-gradient(120deg,#B9BDC4,#9DA2AA);box-shadow:none}
.mcard.moved,.dg-row.moved{animation:slotIn .35s ease-out}
@keyframes slotIn{from{opacity:.35;transform:translateY(-10px)}}

/* v98: the 3D race box class is now .rbox3 (it shared .r3 with the Epic rarity class: Epic marbles' art blew up into the race box shape in the Garage) */

const TRACK_CACHE = {};
function buildTrack(i){
  if(TRACK_CACHE[i]) return TRACK_CACHE[i];
  const def = TRACK_DEFS[i], P = def.pts, n = P.length, dense = [];
  for(let k=0;k<n;k++){
    const p0=P[(k-1+n)%n],p1=P[k],p2=P[(k+1)%n],p3=P[(k+2)%n];
    for(let s=0;s<40;s++){const t=s/40,t2=t*t,t3=t2*t;
      dense.push([.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
                  .5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)]);}
  }
  dense.push(dense[0]);
  const cum=[0]; for(let k=1;k<dense.length;k++) cum.push(cum[k-1]+Math.hypot(dense[k][0]-dense[k-1][0],dense[k][1]-dense[k-1][1]));
  const L = Math.floor(cum[cum.length-1]);
  const xs=new Float32Array(L), ys=new Float32Array(L), nx=new Float32Array(L), ny=new Float32Array(L);
  let j=0;
  for(let d=0;d<L;d++){ while(cum[j+1]<d) j++; const f=(d-cum[j])/((cum[j+1]-cum[j])||1);
    xs[d]=dense[j][0]+(dense[j+1][0]-dense[j][0])*f; ys[d]=dense[j][1]+(dense[j+1][1]-dense[j][1])*f; }
  for(let d=0;d<L;d++){ const a=(d-2+L)%L,b=(d+2)%L; const tx=xs[b]-xs[a],ty=ys[b]-ys[a],m=Math.hypot(tx,ty)||1; nx[d]=-ty/m; ny[d]=tx/m; }
  const zs = def.zones.slice().sort((a,b)=>a[0]-b[0]), segs=[]; let at=0;
  for(const [a,b,type] of zs){ if(a>at) segs.push({type:'wood',f0:at,f1:a}); segs.push({type,f0:a,f1:b}); at=b; }
  if(at<1) segs.push({type:'wood',f0:at,f1:1});
  segs.forEach(s=>{s.d0=Math.floor(s.f0*L); s.d1=Math.floor(s.f1*L); s.len=s.d1-s.d0;});
  const segAt=new Uint8Array(L); segs.forEach((s,i)=>{for(let d=s.d0;d<s.d1&&d<L;d++) segAt[d]=i;});
  const wsum=[0,0,0]; segs.forEach(s=>{ZONES[s.type].w.forEach((w,k)=>wsum[k]+=w*s.len/L);});
  const tr={i,get name(){return def.name},get blurb(){return def.blurb},L,xs,ys,nx,ny,segs,segAt,weights:wsum};
  TRACK_CACHE[i]=tr; return tr;
}

    case 'stab': return t('Twisty and icy this week. Balance your marbles.','Banyak selekoh dan ais minggu ini. Imbangkan guli anda.');
    case 'mood': return t('Fans are unhappy. Win, or be nice at the press conference.','Peminat tak puas hati. Menang, atau bercakap baik di sidang media.');
    case 'cash': return t('You have coins saved. Try the gacha or upgrade a tool.','Ada simpanan syiling. Cuba gacha atau naik taraf alat.');
    case 'odds': return t("Odds are set before you work on the marbles. Backing your own can pay well.","Odds ditetapkan sebelum anda kerjakan guli. Bertaruh pada guli sendiri boleh untung.");
    case 'rumor': return t('Forum rumours are right about half the time. Marble Times is more reliable.','Khabar angin forum betul separuh masa. Utusan Guli lebih tepat.');
    default: return t('Fans like winners and good quotes. Choose your words after the race.','Peminat suka pemenang dan jawapan yang baik. Pilih kata-kata selepas perlumbaan.');
  }});
}

/* ---------- workshop ---------- */
/* ---------- v114 (user): workshop minigames. Every session is a short skill game; the grade sets the gain.
   Grades: Perfect x1.5, Good x1, OK x.6, Miss x.25 of the tool's amount (GAIN / REPAIR). Skip: 40% (Worn-Pro), 60% (Factory, Precision), 80% (Master).
   Better tools make each game easier (MG_EASE = level/5). Coins are paid when the game opens; skipping still pays.
   Polisher: tap 4 times as the buffer crosses the shine. Etcher: keep your finger on the moving etching tip.
   Balancing Rig: tap left/right to keep the bubble centred. Kiln: hold to heat, release in the band. Repair: tap the cracks before the glue dries. ---------- */
const MG_GRADES=[{k:'perfect',min:.85,mult:1.5},{k:'good',min:.6,mult:1},{k:'ok',min:.35,mult:.6},{k:'miss',min:0,mult:.25}];
const MG_NAME=()=>({perfect:t('PERFECT','SEMPURNA'),good:t('GOOD','BAGUS'),ok:t('OK','OK'),miss:t('MISS','TERLEPAS')});
const MG_PACE=.65; /* v115 (user: too fast to react): every minigame 35% slower at every tool level (speeds x.65, timers /.65) */
const MG_SKIP=L=>L>=5?.8:L>=3?.6:.4;

const MG_HINT=()=>({polisher:t('Tap when the buffer crosses the shine. 4 taps.','Tekan bila penggilap melintasi kilauan. 4 kali.'),
  etcher:t('Keep your finger on the glowing tip as it etches the groove.','Letak jari pada hujung bercahaya semasa ia mengukir alur.'),
  balancer:t('Tap left or right to nudge the bubble. Keep it in the middle.','Tekan kiri atau kanan untuk tolak gelembung. Kekalkan di tengah.'),
  hardener:t('Hold to heat. Let go when the needle is in the band.','Tahan untuk panaskan. Lepaskan bila jarum dalam jalur.'),
  repair:t('Tap every crack before the glue dries.','Tekan setiap retak sebelum gam kering.')});
const MG_TITLE=()=>({polisher:t('Buff rhythm','Rentak gilap'),etcher:t('Trace the groove','Ikut alur'),balancer:t('Keep it level','Kekal seimbang'),hardener:t('Heat it right','Panas tepat'),repair:t('Seal the cracks','Tutup retak')});
const MG={};
function mgGrade(s){ return MG_GRADES.find(g=>s>=g.min-1e-9)||MG_GRADES[3]; }
function work(id,tool){ /* v114: pay, then play the minigame; the gain is applied when it ends (mgFinish) */
  const m=byId(id),T=TOOLS[tool]; if(!m||MG.on) return;
  const cost=workCost(m,tool); if(state.cash<cost) return toast(t(`Not enough coins: this costs ${cost}`,`Syiling tak cukup: kos ${cost}`));
  if(tool==='repair'){ if(m.cond>=100) return toast(t(`${m.name} is already in perfect condition`,`${m.name} sudah dalam keadaan sempurna`)); }
  else if(m[T.stat]>=m.cap[T.idx]){ const sn=[t('speed','kelajuan'),t('grip','cengkaman'),t('stability','kestabilan'),t('toughness','ketahanan')][T.idx], mn=MATERIALS[m.mat].name.toLowerCase();
    return toast(t(`${m.name} is at its ${mn} cap for ${sn}`,`${m.name} sudah capai had ${sn} untuk bahan ${mn}`)); }
  const wl=state.wlog||(state.wlog={spent:0,train:{},repairs:0,items:[],melted:[],pulls:0}); wl.spent+=cost; if(tool==='repair') wl.repairs++; else wl.train[id]=(wl.train[id]||0)+1;
  state.cash-=cost; if(tool!=='repair'){ m.wk=(m.wk||0)+1; m.wkS=m.wkS||{}; m.wkS[tool]=(m.wkS[tool]||0)+1; } save(); render();

function mgApply(m,tool,mult){ const T=TOOLS[tool],L=state.tools[tool]||0, before=tool==='repair'?m.cond:m[T.stat];
  if(tool==='repair') m.cond=Math.min(100,m.cond+Math.max(1,Math.round(REPAIR[L]*mult)));
  else m[T.stat]=Math.min(m.cap[T.idx],m[T.stat]+Math.max(1,Math.round(GAIN[L]*mult)));
  const after=tool==='repair'?m.cond:m[T.stat]; ui.flash={id:m.id,stat:tool==='repair'?'cond':T.stat,from:before}; save(); return after-before; }
function mgOpen(m,tool){

    <button class="btn btn-sm mg-skip" data-mg="skip">${t('Skip','Langkau')} · ${Math.round(MG_SKIP(L)*100)}%</button></div>
    <canvas class="mg-cv" width="640" height="640"></canvas><div class="mg-hint">${seen<3?MG_HINT()[tool]:''}</div><div class="mg-res" aria-live="polite"></div></div>`;
  document.body.appendChild(el); state.mgSeen[tool]=seen+1;

  cv.addEventListener('pointerdown',ev=>{ ev.preventDefault(); try{cv.setPointerCapture(ev.pointerId);}catch(e){} MG.down=true; [MG.px,MG.py]=pos(ev); if(mgStartTap()) return; if(MG.phase==='play'&&!MG.done&&MGG[MG.tool].tap) MGG[MG.tool].tap(MG.st,MG.px,MG.py,MG.e); });
  cv.addEventListener('pointermove',ev=>{ [MG.px,MG.py]=pos(ev); });
  const up=()=>{ MG.down=false; if(MG.phase==='play'&&!MG.done&&MGG[MG.tool].release) MGG[MG.tool].release(MG.st,MG.e); };

  MG.key=ev=>{ if(!MG.on||MG.done) return; if(ev.key===' '||ev.key==='Enter'){ ev.preventDefault(); if(ev.type==='keydown'&&!ev.repeat){ MG.down=true; MG.px=320; MG.py=320; if(MG.phase==='wait'&&MG.tool!=='etcher'){ mgStartTap(); } else if(MG.phase==='play'&&MGG[MG.tool].tap) MGG[MG.tool].tap(MG.st,320,320,MG.e,true); } if(ev.type==='keyup'){ up(); } }
    if(MG.tool==='balancer'&&ev.type==='keydown'&&(ev.key==='ArrowLeft'||ev.key==='ArrowRight')&&MG.phase==='play') MGG.balancer.tap(MG.st,ev.key==='ArrowLeft'?100:540,320,MG.e);

  requestAnimationFrame(mgLoop); }
function mgLoop(){ if(!MG.on) return; const now=performance.now(), dt=Math.min(.05,(now-MG.last)/1000); MG.last=now;
  const x=MG.x; x.clearRect(0,0,640,640);

  else if(MG.phase==='count'){ MG.cd-=dt; MGG[MG.tool].draw(x,MG.st,MG.e,0,true); mgText(x,MG.cd>1?'3':MG.cd>.5?'2':'1',96); if(MG.cd<=0){ MG.phase='play'; MG.goT=.45; } }
  else if(!MG.done){ MG.t+=dt; if(MG.goT>0){ MG.goT-=dt; } const r=MGG[MG.tool].step(MG.st,dt,MG.e,MG); MGG[MG.tool].draw(x,MG.st,MG.e,MG.t,false); if(MG.goT>0) mgText(x,t('Go!','Mula!'),72); if(r!=null) mgEnd(r); }
  else MGG[MG.tool].draw(x,MG.st,MG.e,MG.t,false);
  requestAnimationFrame(mgLoop); }
function mgStartTap(){ if(MG.done) return false; /* v115: the first touch starts the game, it is not a game tap */
  if(MG.phase==='wait'){ if(MG.tool==='etcher'){ const p=MGG.etcher.at(MG.st,0); if(Math.hypot(MG.px-p[0],MG.py-p[1])<=MG.st.wid*2.2){ MG.phase='play'; } return true; } MG.phase='count'; MG.cd=1.5; return true; }
  return MG.phase==='count'; }
function mgText(x,s,sz){ x.save(); x.font=`700 ${sz||64}px system-ui,sans-serif`; x.textAlign='center'; x.textBaseline='middle'; x.fillStyle='rgba(255,255,255,.92)'; x.strokeStyle='rgba(0,0,0,.35)'; x.lineWidth=6; x.strokeText(s,320,320); x.fillText(s,320,320); x.restore(); }
function mgEnd(score){ if(MG.done) return; MG.done=true; const skip=score==null, g=skip?null:mgGrade(score), mult=skip?MG_SKIP(MG.L):g.mult;
  const gain=mgApply(MG.m,MG.tool,mult), T=TOOLS[MG.tool], SL={sp:t('Speed','Kelajuan'),gr:t('Grip','Cengkaman'),st:t('Stability','Kestabilan'),tg:t('Toughness','Ketahanan'),cond:t('Condition','Keadaan')}[T.stat];
  const res=MG.el.querySelector('.mg-res'); res.innerHTML=`<div class="mg-stamp ${skip?'skip':g.k}">${skip?t('SKIPPED','DILANGKAU'):MG_NAME()[g.k]}</div><div class="mg-gain">+${gain}${MG.tool==='repair'?'%':''} ${SL}</div>`;
  MG.el.querySelector('.mg-skip').disabled=true; if(!skip&&state.wlog){ const G=state.wlog.mg||(state.wlog.mg={}); G[g.k]=(G[g.k]||0)+1; }
  setTimeout(mgClose,skip?650:1250); }
function mgClose(){ if(!MG.on) return; MG.on=false; document.removeEventListener('keydown',MG.key,true); document.removeEventListener('keyup',MG.key,true); if(MG.el) MG.el.remove(); MG.el=null; render(); }
/* drawing helpers: the marble in the middle (canvas version of its colours) */
function mgMarble(x,m,r){ r=r||170; const g=x.createRadialGradient(320-r*.35,320-r*.4,r*.1,320,320,r); g.addColorStop(0,'#ffffff'); g.addColorStop(.18,m.c2||'#ddd'); g.addColorStop(1,m.c1||'#888');

const MGG={
  polisher:{ init(s,e){ s.ang=-Math.PI/2+Math.PI*.9; s.w=(1.05-.35*e)*Math.PI*2*MG_PACE; s.z=(22+14*e)*Math.PI/180; s.taps=[]; s.need=4; s.max=6.5/MG_PACE; },
    tap(s){ if(s.taps.length>=s.need) return; const d=Math.abs(Math.atan2(Math.sin(s.ang+Math.PI/2),Math.cos(s.ang+Math.PI/2))); s.taps.push(d<=s.z*.45?1:d<=s.z?.75:d<=s.z*2?.4:0); s.flash=.25; },

    draw(x,s,e,tm){ mgMarble(x,MG.m,165); x.save(); x.translate(320,320);

      x.strokeStyle='rgba(255,214,90,.9)'; x.lineWidth=12; x.beginPath(); x.arc(0,0,215,-Math.PI/2-s.z*.45,-Math.PI/2+s.z*.45); x.stroke();
      const bx=Math.cos(s.ang)*215, by=Math.sin(s.ang)*215; x.fillStyle=s.flash?'#FFE14D':'#F26A1B'; x.beginPath(); x.arc(bx,by,30,0,Math.PI*2); x.fill(); x.strokeStyle='#fff'; x.lineWidth=5; x.stroke();

  etcher:{ init(s,e){ s.T=3.2/MG_PACE; s.wid=22+16*e; s.acc=0; s.n=0; s.pts=[]; for(let i=0;i<=60;i++){ const u=i/60; s.pts.push([150+u*340,320+Math.sin(u*Math.PI*2.2)*95*(1-.25*e)]); } },

    draw(x,s,e,tm){ mgMarble(x,MG.m,200); x.save(); x.lineCap='round'; x.lineJoin='round';

      const p=this.at(s,u); x.fillStyle=s.on?'#5BE38A':'#FFE14D'; x.beginPath(); x.arc(p[0],p[1],18,0,Math.PI*2); x.fill(); x.strokeStyle='#1B1E1C'; x.lineWidth=4; x.stroke(); x.restore(); } },
  balancer:{ init(s,e){ s.T=3.2/MG_PACE; s.x=0; s.v=0; s.c=.2+.13*e; s.a=(2.4-1.1*e)*MG_PACE; s.acc=0; s.n=0; s.tw=0; },
    tap(s,px,py,e,key){ if(key) return; s.v+=(px<320?-1:1)*1.15*.85; },
    step(s,dt,e,G){ s.tw-=dt; if(s.tw<=0){ s.tw=(.35+Math.random()*.4)/MG_PACE; s.push=(Math.random()<.5?-1:1)*s.a*(.6+Math.random()*.8); }

    draw(x,s,e,tm){ mgMarble(x,MG.m,120); x.save(); x.translate(320,470);
      x.fillStyle='#2E3236'; x.beginPath(); x.roundRect(-260,-34,520,68,34); x.fill();
      x.fillStyle='rgba(91,227,138,.35)'; x.fillRect(-260*s.c*2,-28,520*s.c*2,56); x.fillStyle='rgba(91,227,138,.75)'; x.fillRect(-260*s.c,-28,520*s.c,56);

      x.fillStyle='rgba(255,255,255,.75)'; x.font='600 44px system-ui,sans-serif'; x.textAlign='center'; x.fillText('◀',-300+40,120); x.fillText('▶',300-40,120);

  hardener:{ init(s,e){ s.h=0; s.v=(.42-.12*e)*MG_PACE; s.mid=.58+Math.random()*.26; s.b=.05+.045*e; s.held=false; s.wait=6; },

      x.fillStyle='rgba(255,255,255,.85)'; x.font='600 28px system-ui,sans-serif'; x.textAlign='center'; x.fillText(s.held?(s.rel?'':t('Heating…','Memanaskan…')):t('Hold','Tahan'),0,270); x.restore(); } },
  repair:{ init(s,e){ const n=3+Math.floor(Math.random()*3); s.T=(2.4+1.3*e)/MG_PACE; s.r=34+14*e; s.c=[]; for(let i=0;i<n&&s.c.length<n;i++){ for(let k=0;k<40;k++){ const a=Math.random()*Math.PI*2, d=Math.sqrt(Math.random())*130, p=[320+Math.cos(a)*d,320+Math.sin(a)*d];

function useItem(id,k){
  if(!state.items[k]) return;
  if(k==='charm'){ if(state.charm) return toast(t('A Lucky Charm is already active this race','Tangkal Tuah sudah aktif untuk perlumbaan ini')); state.charm=true; }
  else { const m=byId(id); if(!m) return; const before={sp:m.sp,cond:m.cond};
    const B=ITEMS[k].boost; if(B){ m.boost=m.boost||{}; if(m.boost[B[0]]) return toast(t(`${m.name} already has that boost for the next race`,`${m.name} sudah ada rangsangan itu untuk perlumbaan seterusnya`)); m.boost[B[0]]=B[1]; }
    if(k==='fix'){ if(m.cond>=100) return toast(t(`${m.name} is already in perfect condition`,`${m.name} sudah dalam keadaan sempurna`)); m.cond=Math.min(100,m.cond+40); }
    if(k==='fix') ui.flash={id,stat:'cond',from:before.cond}; }
  if(state.wlog) state.wlog.items.push(k);

/* ---------- sponsors (v60): pick one of three offers each season. A weekly budget, bonuses for race targets, and a season goal.
   Targets are set from where the team really stands (team and marble strength), so a team at the bottom still gets goals it can hit. ---------- */
const SPON_X=()=>tier().prize*2; // money scale by league: M4 1, M3 3, M2 8, M1 20
const SPON_NAMES={safe:['Kedai Runcit Pak Mat','Kopitiam Ah Hock','Mamak Bistro 24 Jam','Dobi Bersih Cepat','Bengkel Motor Ali'],
  risky:['Tenaga Kilat','Roket Delivery','Gerak Pantas Courier','Turbo Teh Tarik','Lompat Fintech'],
  trait:{cornerer:'Bengkel Selekoh Tajam',slipstream:'Kipas Angin Bayu',bully:'Gym Samseng',diva:'Salon Primadona',hardworker:'Kedai Besi Tekun',skater:'Ais Batu Kutub',heavy:'Simen Kukuh',slicky:'Minyak Licin Jaya',sprinter:'Kilat Ekspres',bouncy:'Getah Kenyal',glass:'Kaca Jernih',wobbler:'Buaian Ria',late:'Kedai Malam Bulan',start:'Subuh Bakery',tank:'Perisai Insurans',wildcard:'Dadu Board Games',shover:'Tolak Movers'}};
const SPON_KIND={safe:()=>t('Steady','Stabil'),risky:()=>t('High risk','Risiko tinggi'),trait:()=>t('Specialist','Pakar')};
const mPow=m=>(m.sp+m.gr+m.st)/3;
function strengthTable(){ // teams by average marble strength (your two best marbles)
  const mine=state.roster.slice().sort((a,b)=>mPow(b)-mPow(a)).slice(0,2), avg=ms=>ms.reduce((a,m)=>a+mPow(m),0)/(ms.length||1);
  return [{k:'you',p:avg(mine)},...state.rivals.map((tm,i)=>({k:'r'+i,p:avg(tm.marbles)}))].sort((a,b)=>b.p-a.p); }
function bestMarbleRank(){ const best=Math.max(...state.roster.map(mPow)), all=state.rivals.flatMap(tm=>tm.marbles).map(mPow); return 1+all.filter(p=>p>best).length; }
function makeSponsorOffers(){
  const R=strengthTable(), yi=R.findIndex(r=>r.k==='you'), tgt=R[yi>0?yi-1:1].k, k2=R[Math.max(0,yi-2)].k, tgt2=k2==='you'?tgt:k2, mr=bestMarbleRank(), x=SPON_X(), sc=v=>Math.round(v*x/5)*5;
  const offers=[
    {kind:'safe',name:pick(SPON_NAMES.safe),base:sc(70),targets:[{t:'both',bonus:sc(25)},{t:'ahead',team:tgt,bonus:sc(35)}],season:{t:'beat',team:tgt,bonus:sc(250)}},
    {kind:'risky',name:pick(SPON_NAMES.risky),base:sc(25),targets:[{t:'top',n:clamp(mr-2,3,12),bonus:sc(80)},{t:'gain',n:4,bonus:sc(60)}],season:{t:'pos',n:clamp(yi+1-2,1,8),bonus:sc(600)}}];
  const tr=[...new Set(state.roster.flatMap(m=>traitList(m)))].filter(k=>SPON_NAMES.trait[k]);
  if(tr.length){ const k=pick(tr); offers.push({kind:'trait',name:SPON_NAMES.trait[k],trait:k,base:sc(45),targets:[{t:'trait',trait:k,n:clamp(mr,4,12),bonus:sc(60)},{t:'both',bonus:sc(20)}],season:{t:'pos',n:clamp(yi+1-1,1,8),bonus:sc(350)}}); }
  else offers.push({kind:'safe',name:pick(SPON_NAMES.safe.filter(n=>n!==offers[0].name)),base:sc(60),targets:[{t:'top',n:clamp(mr+2,6,14),bonus:sc(30)},{t:'ahead',team:tgt2,bonus:sc(45)}],season:{t:'beat',team:tgt2,bonus:sc(300)}});
  const R0=state.sponsorRenew; if(R0){ const i=offers.findIndex(o=>o.kind===R0.kind); const o=offers[i>=0?i:0]; o.name=R0.name; o.base=Math.round(o.base*1.2/5)*5; o.renew=true; } // a happy sponsor comes back with more money
  return offers; }
function ensureSponsor(){ if(!state.sponsor&&!(state.sponsorOffers&&state.sponsorOffers.length)) state.sponsorOffers=makeSponsorOffers(); }
function spTarget(g){ const tn=k=>esc((teamOf(k)||{}).name||'?');

    case 'top': return t(`A marble in the top ${g.n}`,`Satu guli dalam ${g.n} teratas`);

    case 'trait': return t(`Your ${TRAITS[g.trait].name.toLowerCase()} marble in the top ${g.n}`,`Guli ${TRAITS[g.trait].name.toLowerCase()} anda dalam ${g.n} teratas`);
    case 'beat': return t(`Season: finish ahead of ${tn(g.team)}`,`Musim: tamat di depan ${tn(g.team)}`);
    case 'pos': return t(`Season: finish P${g.n} or better`,`Musim: tamat P${g.n} atau lebih baik`); } return ''; }

    <p class="note" style="margin:0 0 14px">${t('One deal for the whole season: money every race, bonuses for targets, and a season goal. Pick one to continue.','Satu tawaran untuk sepanjang musim: wang setiap perlumbaan, bonus untuk sasaran, dan matlamat musim. Pilih satu untuk teruskan.')}</p>

function finishWeek(destination){

function animateKpi(id,key,to,isCoin){
  const el=$('#'+id); if(!el) return; const show=v=>{el.innerHTML=isCoin?coins(v):fmt(v);};
  const from=ui.shown[key]; ui.shown[key]=to;
  if(from==null||from===to||RM()){ show(to); return; }
  el.classList.add(to>from?'up':'down'); const st=performance.now(), dur=700;

  show(from); requestAnimationFrame(step);
}

  const cal=`<section class="dc" style="grid-area:cal"><h3 class="dc-t">${ic('timer')}${t('Calendar','Kalendar')}<span class="dim">· ${t('Season','Musim')} ${state.seasonNum}</span></h3><div class="cal">${calHtml()}</div></section>`;
  const fz=friendNote?`<div class="card friend" style="grid-area:fz"><span class="avatar" aria-hidden="true">F</span><div><span class="eyebrow">${ic('message')}${esc(state.friend)}</span><p>${esc(tx(friendNote.body))}</p></div></div>`:'';
  return `<div class="dash">${nx}${ga}${st}${nw}<div style="grid-area:sp;min-width:0">${sponsorCard()}</div>${cal}${fz}</div>`;
}
function drawMini(){const c=$('#mini');if(!c)return;const dpr=Math.min(2,window.devicePixelRatio||1);const w=c.clientWidth||300;c.width=Math.round(w*dpr);c.height=Math.round(w*.6*dpr);const ti=curIdx(); if(use3D(ti)) drawTrack3Mini(c.getContext('2d'),ti,c.width,c.height); else drawTrackTo(c.getContext('2d'),curTrack(),c.width/1000,true);}
function setTopH(){ const tb=document.querySelector('.topbar'); if(tb) document.documentElement.style.setProperty('--topH',tb.offsetHeight+'px'); } // the sticky tab bar sits just below the top bar
function render(){ try{ if(state&&Array.isArray(state.news)&&!state.rework105){ state.rework105=true; state.news.unshift({tag:'report',src:both(()=>t('Marble Times','Utusan Guli')),head:both(()=>t('League changes how marbles are rated','Liga ubah cara guli dinilai')),body:both(()=>t('Toughness now decides cracks and wear. Weight is shown as Light, Medium or Heavy: light marbles are nimble, heavy ones keep their speed and win bumps. Low Stability wobbles in tricky sections. Tank is now Unbreakable, Heavy is now Steamroller.','Ketahanan kini menentukan retak dan kehausan. Berat ditunjukkan sebagai Ringan, Sederhana atau Berat: guli ringan lincah, guli berat kekal laju dan menang pelanggaran. Kestabilan rendah goyah di bahagian sukar. Kebal kini Tak Pecah, Berat kini Penggelek.'))}); save(); } if(R3.state==='ready'&&state&&state.season&&state.phase!=='race'&&!SCN.pre&&curIdx()===0) setTimeout(preloadScenery,400); }catch(e){}
  if(!state) return;
  renderTop(); setTopH();
  const panel=$('#panel');
  panel.innerHTML=({raceday:panelRaceDay,garage:panelGarage,gacha:panelGacha,news:panelNews,bets:panelBets,standings:panelStandings}[ui.tab]||panelRaceDay)();
  if(ui.lastTab!==ui.tab){ panel.classList.remove('enter'); void panel.offsetWidth; panel.classList.add('enter'); ui.lastTab=ui.tab; }
  ui.flash=null; ui.moved=null;
  renderTabs(); drawMini(); mountGacha(); drawNewsMap(); showPullSheet(); sponsorGate();
}

/* ---------- language ---------- */
function applyStatic(){
  document.documentElement.lang=LANG==='en'?'en':'ms';
  document.querySelectorAll('[data-i18n]').forEach(el=>{const [en,bm]=el.dataset.i18n.split('|');el.textContent=LANG==='en'?en:bm;});
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>{const [en,bm]=el.dataset.i18nAria.split('|');el.setAttribute('aria-label',LANG==='en'?en:bm);});
}
function setLang(l){
  if(l!=='en'&&l!=='bm') return;
  LANG=l; try{localStorage.setItem(LANG_KEY,l);}catch(e){}
  applyStatic();
  if(!state){ const v=$('#teamName')?$('#teamName').value:undefined; showIntro(v); return; }
