/* ---------- game menu (v67): back up / restore the save, new career ---------- */
const SAVE_TAG='marble-race-tycoon';
function savePayload(){ return JSON.stringify({game:SAVE_TAG,v:state.v,savedAt:new Date().toISOString(),state}); }
function saveFileName(){ const d=new Date(),p=n=>String(n).padStart(2,'0'); return `marble-tycoon-${state.team.code}-M${4-state.tier}-S${state.seasonNum}-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`; }
function menuOpen(){
  modal(`<div class="eyebrow">${ic('menu')}${t('Menu','Menu')}</div><h2>${t('Save and career','Simpanan dan kerjaya')}</h2>
  <p class="note">${t('The game saves itself after every action, in this browser on this device. Back it up to keep it safe or to move it to another device.','Permainan disimpan sendiri selepas setiap tindakan, dalam pelayar ini di peranti ini. Buat salinan untuk keselamatan atau untuk pindah ke peranti lain.')}</p>
  <div class="menu-list">
    <button class="menu-item" data-act="saveExport">${ic('download')}<span><strong>${t('Back up save','Salin simpanan')}</strong><small>${t('Download a save file (.json)','Muat turun fail simpanan (.json)')}</small></span></button>
    <button class="menu-item" data-act="saveCode">${ic('copy')}<span><strong>${t('Copy save code','Salin kod simpanan')}</strong><small>${t('A text code you can paste anywhere','Kod teks yang boleh ditampal di mana-mana')}</small></span></button>
    <button class="menu-item" data-act="saveImport">${ic('upload')}<span><strong>${t('Restore a save','Pulihkan simpanan')}</strong><small>${t('From a save file or a pasted code','Dari fail simpanan atau kod yang ditampal')}</small></span></button>
    <button class="menu-item danger" data-act="newCareerAsk">${ic('refresh')}<span><strong>${t('New career','Kerjaya baru')}</strong><small>${t('Start over from M4','Mula semula dari M4')}</small></span></button>
  </div>
  <div class="actions"><button class="btn" data-act="closeModal">${t('Close','Tutup')}</button></div>`); }
async function saveExport(){ save(); const data=savePayload(), name=saveFileName();
  let dl=null; try{ dl=await claude.use('downloads'); }catch(e){}
  if(dl){ try{ await dl.save({filename:name,data}); toast(t('Save file ready','Fail simpanan sedia')); }catch(e){ if(e&&e.code==='declined') return; saveCodeView(); } return; }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast(t('Save file downloaded','Fail simpanan dimuat turun')); }catch(e){ saveCodeView(); } }
function saveCodeView(){ save(); const code=btoa(unescape(encodeURIComponent(savePayload())));
  modal(`<div class="eyebrow">${ic('copy')}${t('Save code','Kod simpanan')}</div><h2>${t('Copy this code','Salin kod ini')}</h2>
  <p class="note">${t('Keep it somewhere safe (notes, chat to yourself). Paste it into Restore a save on any device.','Simpan di tempat selamat (nota, mesej kepada diri sendiri). Tampal dalam Pulihkan simpanan di mana-mana peranti.')}</p>
  <textarea class="save-code" readonly rows="6">${code}</textarea>
  <div class="actions"><button class="btn" data-act="menuOpen">${t('Back','Kembali')}</button><button class="btn btn-primary" data-act="saveCopy">${ic('copy')}${t('Copy','Salin')}</button></div>`);
  const ta=$('#modal .save-code'); if(ta) ta.addEventListener('focus',()=>ta.select()); }
async function saveCopy(){ const ta=$('#modal .save-code'); if(!ta) return; ta.select(); let ok=false; try{ await navigator.clipboard.writeText(ta.value); ok=true; }catch(e){ try{ ok=document.execCommand('copy'); }catch(e2){} }
  toast(ok?t('Save code copied','Kod simpanan disalin'):t('Select the code and copy it','Pilih kod dan salin')); }
function saveImportView(){
  modal(`<div class="eyebrow">${ic('upload')}${t('Restore a save','Pulihkan simpanan')}</div><h2>${t('Load a backup','Muat salinan')}</h2>
  <p class="note">${t('Pick a save file or paste a save code. This replaces your current career.','Pilih fail simpanan atau tampal kod simpanan. Ini menggantikan kerjaya anda sekarang.')}</p>
  <label class="btn" style="margin:6px 0 10px">${ic('upload')}${t('Choose save file','Pilih fail simpanan')}<input type="file" accept=".json,.txt,application/json,text/plain" hidden id="saveFile"></label>
  <textarea class="save-code" id="saveText" rows="5" placeholder="${t('…or paste a save code here','…atau tampal kod simpanan di sini')}"></textarea>
  <p class="note neg" id="saveErr" hidden></p>
  <div class="actions"><button class="btn" data-act="menuOpen">${t('Back','Kembali')}</button><button class="btn btn-danger" data-act="saveLoad">${t('Replace my career','Gantikan kerjaya saya')}</button></div>`);
  const f=$('#saveFile'); if(f) f.addEventListener('change',()=>{ const file=f.files&&f.files[0]; if(!file) return; file.text().then(txt=>{ $('#saveText').value=txt; toast(t('File loaded. Tap Replace my career.','Fail dimuat. Tekan Gantikan kerjaya saya.')); }); }); }
function parseSave(txt){ txt=(txt||'').trim(); if(!txt) return null; let o=null;
  try{ o=JSON.parse(txt); }catch(e){ try{ o=JSON.parse(decodeURIComponent(escape(atob(txt.replace(/\s+/g,''))))); }catch(e2){ return null; } }
  const st=o&&o.game===SAVE_TAG?o.state:o; return st&&st.v===4&&st.team&&Array.isArray(st.roster)&&Array.isArray(st.rivals)?st:null; }
function saveLoad(){ const st=parseSave(($('#saveText')||{}).value), err=$('#saveErr');
  if(!st){ if(err){ err.hidden=false; err.textContent=t('That is not a valid save for this game.','Itu bukan simpanan yang sah untuk permainan ini.'); } return; }
  try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){ if(err){ err.hidden=false; err.textContent=t('Could not write the save in this browser.','Tidak dapat menulis simpanan dalam pelayar ini.'); } return; }
  toast(t(`Loaded ${st.team.name}`,`${st.team.name} dimuat`)); setTimeout(()=>location.reload(),300); }
function askNew(){
  modal(`<div class="eyebrow">${t('New career','Kerjaya baru')}</div><h2>${t('Start over?','Mula semula?')}</h2><p>${t("Your current team, marbles and coins will be gone. This can't be undone.",'Pasukan, guli dan syiling anda sekarang akan hilang. Ini tidak boleh dibatalkan.')}</p>
  <div class="actions"><button class="btn" data-act="closeModal">${t('Keep playing','Teruskan bermain')}</button><button class="btn btn-danger" data-act="newCareerYes">${t('Start a new career','Mula kerjaya baru')}</button></div>`);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return; const a=b.dataset.act,v=b.dataset.v,id=b.dataset.id; if(b.tagName==='A') e.preventDefault();
  if(b.tagName==='SELECT') return;
  switch(a){
    case 'lang': setLang(v); break;
    case 'theme': setTheme(isDark()?'light':'dark'); break;
    case 'music': musicCycle(); break;
    case 'tab': ui.tab=v; ui.confirmRelease=null; render(); if(b.closest('.dash')) window.scrollTo(0,0); break;
    case 'dashRename': ui.tab='garage'; ui.renaming=id; render(); window.scrollTo(0,0); setTimeout(()=>{const i=$('#renameInput');if(i){i.focus();i.select();}},30); break;
    case 'dashPull': ui.tab='gacha'; render(); window.scrollTo(0,0); pull(+v); break;
    case 'enter': toggleEntry(id); break;
    case 'work': work(id,v); break;
    case 'gtab': ui.gtab=v; render(); break;
    case 'upgrade': upgrade(v); break;
    case 'charm': useItem(null,'charm'); break;
    case 'releaseAsk': ui.confirmRelease=id; render(); break;
    case 'upToggle': ui.openUp=ui.openUp===id?null:id; render(); break;
    case 'toolsToggle': ui.toolsOpen=!ui.toolsOpen; render(); break;
    case 'releaseCancel': ui.confirmRelease=null; render(); break;
    case 'release': release(id); break;
    case 'machine': ui.machine=+v; render(); break;
    case 'pull': pull(+v); break;
    case 'pullMelt': resolvePull('melt'); break;
    case 'pullKeep': resolvePull('keep'); break;
    case 'pullOk': resolvePull('ok'); break;
    case 'cascadeSkip': if(ui.casFin) ui.casFin(); break;
    case 'pullSwap': resolvePull('swap',id); break;
    case 'betPick': ui.bet={key:id,type:v}; render(); break;
    case 'stake': ui.stake=Math.max(1,+v); render(); break;
    case 'placeBet': placeBet(); break;
    case 'betCancel': cancelBet(+v); break;
    case 'startRace': if(!state.sponsor){ sponsorGate(); break; } startRace(); break;
    case 'riskGo': ui.riskOK=true; closeModal(); startRace(); break;
    case 'sponsorPick': signSponsor(+v); break;
    case 'allMarbles': ui.allMarbles=!ui.allMarbles; render(); break;
    case 'monsoonOrder':
      if(ui.mode3&&W?.tr.monsoon&&['push','hold','protect'].includes(v)){
        W.teamOrder=v; W.balls.filter(b=>b.you).forEach(b=>{b.nextLaneDecision=0;});
        renderRaceControls();
      }
      break;
    case 'speed': setSpeed(+v); break;
    case 'skip': skipRace(); break;
    case 'pause': togglePause(); break;
    case 'cam': if(typeof S3!=='undefined') S3.hero=null; ui.cam=v; renderCams(); break;
    case 'full': setFull(!ui.full); break;
    case 'feedF': ui.feedF=v; render(); break;
    case 'like': { const L=ui.liked||(ui.liked={}); L[v]=!L[v]; render(); } break;
    case 'tags': ui.noTags=!ui.noTags; try{localStorage.setItem('marble-race-tycoon-notags',ui.noTags?'1':'0');}catch(e){} renderCams(); tags3(); break;
    case 'walkSkip': endWalk(true); break;
    case 'towerToggle': towerToggle(); break;
    case 'continueResults':
      if(state.phase!=='results') break;
      state.press={heat:0,mood:0,mult:1,best:Math.min(...state.lastRace.you.map(y=>y.dnf?99:y.pos))};
      finishWeek(v==='garage'?'garage':'raceday');
      break;
    case 'toPress': buildPress(); state.phase='press'; save(); showPress(); break;
    case 'answer': answer(+v); break;
    case 'nextRace': nextRace(); break;
    case 'seasonGo': seasonGo(); break;
    case 'newCareerAsk': askNew(); break;
    case 'newCareerYes': try{localStorage.removeItem(KEY);}catch(err){} state=null; cancelAnimationFrame(raf); $('#raceView').hidden=true; showIntro(); break;
    case 'closeModal': closeModal(); if(state) resumePhase(); break;
    case 'menuOpen': menuOpen(); break;
    case 'saveExport': saveExport(); break;
    case 'saveCode': saveCodeView(); break;
    case 'saveCopy': saveCopy(); break;
    case 'saveImport': saveImportView(); break;
    case 'saveLoad': saveLoad(); break;
    case 'teamEdit': ui.teamDraft=null; showTeamEditor(); setTimeout(()=>{const i=$('#teamNameEdit');i&&i.focus();},50); break;
    case 'flagPat': ui.teamDraft.flag.p=v; showTeamEditor(); break;
    case 'flagCol': ui.teamDraft.flag.c[+id]=v; showTeamEditor(); break;
    case 'teamSave': saveTeam(); break;
    case 'teamCancel': ui.teamDraft=null; closeModal(); break;
    case 'renameAsk': ui.renaming=id; render(); setTimeout(()=>{const i=$('#renameInput');if(i){i.focus();i.select();}},30); break;
    case 'renameCancel': ui.renaming=null; render(); break;
  }
});
document.addEventListener('change',e=>{
  const s=e.target;
  if(s.matches('select[data-act="use"]')&&s.value){ useItem(s.dataset.id,s.value); }
  if(/^flagCustom\d$/.test(s.id)&&ui.teamDraft){ ui.teamDraft.flag.c[+s.id.slice(-1)]=s.value.toUpperCase(); showTeamEditor(); }
  if(s.id==='stakeInput'){ ui.stake=Math.max(1,Math.floor(+s.value||1)); setTimeout(render,0); } // deferred: re-rendering inside the blur that fires change breaks the DOM swap
});
document.addEventListener('input',e=>{ if(e.target.id==='teamNameEdit'&&ui.teamDraft){ ui.teamDraft.name=e.target.value; const tn=$('.flag-preview .team-name'),tc=$('.flag-preview .note'); if(tn)tn.textContent=e.target.value||'—'; if(tc)tc.textContent=codeOf(e.target.value||''); } });
document.addEventListener('submit',e=>{
  if(e.target.id==='renameForm'){ e.preventDefault(); renameMarble(e.target.dataset.id,$('#renameInput').value); return; }
  if(e.target.id==='introForm'){ e.preventDefault(); const n=($('#teamName').value||'').trim()||'Kilat Racing'; newCareer(n.slice(0,24)); closeModal(); ui.tab='raceday'; showHub(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('#modal').hidden&&state&&state.phase==='hub'&&!ui.sponGate&&!ui.pullSheet){ closeModal(); } });

function resumePhase(){
  $('#app').hidden=false;
  if(state.phase==='race'){ state.phase='hub'; }
  if(state.phase==='results'){ showHub(); showResults(); return; }
  if(state.phase==='press'){ showHub(); if(!state.press) buildPress(); showPress(); return; }
  if(state.phase==='summary'){ state.phase='hub'; nextRace(); return; }
  if(state.phase==='season'){ showHub(); endSeasonView(); return; }
  showHub();
}
function endSeasonView(){ state.season.raceIdx=state.season.calendar.length-1; const p=state.pending; if(p){ state.cash-=p.bonus; state.history.pop(); } endSeason(); }

function migrateCalendar(){ // older saves: upcoming races move to 3D-ready tracks
  const S=state.season; if(!S) return; const from=(state.phase==='hub'||state.phase==='race')?S.raceIdx:S.raceIdx+1; let changed=false,cur=false;
  for(let i=from;i<S.calendar.length;i++) if(!has3D(S.calendar[i])){ S.calendar[i]=READY3[i%READY3.length]; changed=true; if(i===S.raceIdx) cur=true; }
  // seasons drawn before newer 3D tracks existed: put the missing ones into the upcoming races (after this week's)
  const missing=READY3.filter(ti=>!S.calendar.slice(from).includes(ti)), slots=[];
  for(let i=Math.max(from,S.raceIdx+1);i<S.calendar.length;i++) if(S.calendar.filter(x=>x===S.calendar[i]).length>1||!READY3.includes(S.calendar[i])) slots.push(i);
  missing.forEach((ti,k)=>{ if(k<slots.length){ S.calendar[slots[k]]=ti; changed=true; } });
  if(cur){ genNews(); refreshOdds(); } if(changed) save();
}
function boot(data){
  applyStatic();
  const saved=(data&&data.state)||loadSaved();
  $('#app').hidden=false;
  if(saved){ state=saved; const fix=m=>{if(m&&!m.tpl)m.tpl=tplOf(m.id,m.mat);}; (state.roster||[]).forEach(fix); (state.rivals||[]).forEach(tm=>tm.marbles.forEach(fix)); if(state.pull&&state.pull.m) fix(state.pull.m); if(state.odds) state.odds.forEach(o=>{const m=(state.roster||[]).find(x=>x.id===o.key)||(state.rivals||[]).flatMap(tm=>tm.marbles).find(x=>x.id===o.key);if(m)o.tpl=m.tpl;});
    if(!state.traitsV){ state.traitsV=2; const mp=m=>{ if(m&&m.trait&&!TRAITS[m.trait]) m.trait=OLD_TRAIT[m.trait]||null; };
      (state.roster||[]).forEach(mp); (state.rivals||[]).forEach(tm=>tm.marbles.forEach(m=>{ mp(m); if(!m.trait) m.trait=rivalTrait(teamStyle(tm),state.tier); })); if(state.pull&&state.pull.m) mp(state.pull.m);
      refreshOdds(); }
    if(state.tier>=SCALE_FROM&&state.season&&!state.season.scaled){ scaleRivals(); save(); } // v65: a save already in M3+ gets scaled rivals now
    if(CAN3D) migrateCalendar(); resumePhase(); } else showIntro();
  load3D().then(ok=>{ if(state&&!$('#hub').hidden) render(); });
}
window.claude?.hot?.snapshot?.(()=>({state}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
